<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>SBI Site Attendance</title>
<style>
  :root{
    --brand:#be1e2d; --ink:#141414; --soft:#6b7280; --line:#e5e7eb;
    --bg:#f5f6f8; --card:#fff; --ok:#137a3f; --okbg:#e7f5ec;
    --warn:#8a5a00; --warnbg:#fff4e0; --err:#a11; --errbg:#fdecec;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}

  .bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--brand);color:#fff}
  .bar img{height:30px;background:#fff;padding:3px 6px;border-radius:4px}
  .bar .site{font-weight:700;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar button{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:4px;
    padding:8px 12px;font-weight:700;font-size:13px}

  main{flex:1;padding:14px}
  .hidden{display:none !important}

  /* camera stage */
  .stage{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:3/4}
  .stage video,.stage img.frame{width:100%;height:100%;object-fit:cover;display:block}
  .stage video,.stage img.frame{filter:brightness(.92) contrast(1.05)}
  /* dark spotlight: edges dark, centre (face) clear */
  .spot{position:absolute;inset:0;pointer-events:none;border-radius:14px;
    background:radial-gradient(ellipse 62% 50% at 50% 44%,
      rgba(0,0,0,0) 0%, rgba(0,0,0,0) 42%, rgba(0,0,0,.55) 78%, rgba(0,0,0,.82) 100%)}
  .cam-ctrl{display:flex;gap:8px;margin-bottom:10px}
  .cc{flex:1;min-height:44px;border:2px solid var(--line);background:var(--card);border-radius:10px;
    font-size:14px;font-weight:700;color:var(--ink)}
  .cc[aria-pressed="false"]{color:var(--soft)}
  .track{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .ring{position:absolute;inset:0;pointer-events:none;border:4px solid transparent;border-radius:14px;
    transition:border-color .15s}
  .stage[data-face="yes"] .ring{border-color:#22c55e}
  .stage[data-face="near"] .ring{border-color:#f59e0b}
  .badge{position:absolute;left:0;right:0;bottom:0;padding:14px;
    background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff}
  .badge .who{font-size:22px;font-weight:800;line-height:1.15}
  .badge .sub{font-size:14px;opacity:.9;margin-top:2px}
  .count{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.6);color:#fff;
    width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:26px;font-weight:800}

  .note{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:15px;font-weight:600;
    background:var(--card);border:1px solid var(--line)}
  .note[data-tone="ok"]{background:var(--okbg);color:var(--ok);border-color:transparent}
  .note[data-tone="warn"]{background:var(--warnbg);color:var(--warn);border-color:transparent}
  .note[data-tone="err"]{background:var(--errbg);color:var(--err);border-color:transparent}

  .row{display:flex;gap:10px;margin-top:12px}
  .btn{flex:1;min-height:58px;border:0;border-radius:10px;font-size:16px;font-weight:800;
    background:var(--brand);color:#fff}
  .btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line)}
  .btn:disabled{opacity:.5}

  /* today strip */
  .today{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .today h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:700}
  .chip.done{background:var(--okbg);color:var(--ok);border-color:transparent}

  /* modal */
  .back{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--card);width:100%;max-width:560px;border-radius:16px 16px 0 0;max-height:94dvh;
    overflow:auto;display:flex;flex-direction:column}
  .sheet h2{margin:0;padding:16px 18px;font-size:18px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--card)}
  .sheet .body{padding:16px 18px}
  .sheet .foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;
    position:sticky;bottom:0;background:var(--card)}
  label{display:block;font-size:13px;font-weight:700;color:var(--soft);margin:12px 0 5px}
  input,select{width:100%;min-height:52px;border:2px solid var(--line);border-radius:10px;
    padding:0 14px;font-size:16px;background:#fff;color:var(--ink)}

  .seg{display:flex;gap:8px;margin-bottom:6px}
  .seg button{flex:1;min-height:52px;border:2px solid var(--line);background:#fff;border-radius:10px;
    font-size:15px;font-weight:800;color:var(--soft)}
  .seg button[aria-pressed="true"]{border-color:var(--brand);color:var(--brand)}

  .tiny{font-size:13px;color:var(--soft);margin-top:6px}
  .rw{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .rw .av{width:44px;height:44px;border-radius:10px;background:var(--bg);object-fit:cover;flex:0 0 auto}
  .rw .nm{flex:1;font-weight:700}
  .rw .nm small{display:block;font-weight:600;color:var(--soft);font-size:12px}
  .rw .st{font-size:12px;font-weight:800;padding:4px 10px;border-radius:20px}
  .rw .st.on{background:var(--okbg);color:var(--ok)} .rw .st.off{background:var(--bg);color:var(--soft)}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <img src="/assets/sbi_projects/site_app/sbi-logo-full.png" alt="SBI">
    <span class="site" id="siteName">Site<small id="clock" style="display:block;font-size:11px;font-weight:600;opacity:.85"></small></span>
    <button id="btnWorkers" type="button">Workers</button>
    <button id="btnMode" type="button">Add worker</button>
  </div>

  <main>
    <!-- ATTENDANCE (default) -->
    <section id="attend">
      <div class="cam-ctrl">
        <button type="button" class="cc" id="flipA">Flip camera</button>
        <button type="button" class="cc" id="darkA" aria-pressed="true">Dark bg: On</button>
      </div>
      <div class="stage" id="stageA" data-face="no">
        <video id="camA" playsinline muted autoplay></video>
        <div class="spot"></div>
        <canvas id="trackA" class="track"></canvas>
        <div class="ring"></div>
        <div class="count hidden" id="countA">3</div>
        <div class="badge">
          <div class="who" id="whoA">Looking for a face...</div>
          <div class="sub" id="subA">Look at the camera and hold still.</div>
        </div>
      </div>
      <div class="note" id="noteA" data-tone="">Point the camera at a worker's face.</div>
      <div class="today hidden" id="todayA">
        <h3 id="todayName">Today</h3>
        <div class="chips" id="todayChips"></div>
      </div>
    </section>

    <!-- WORKERS (this site only) -->
    <section id="workers" class="hidden">
      <div class="note" data-tone="">Workers enrolled at this site. Green = on site now.</div>
      <div id="rosterList" style="margin-top:12px"></div>
    </section>

    <!-- ENROLL -->
    <section id="enroll" class="hidden">
      <div class="seg">
        <button type="button" data-wt="Labour" aria-pressed="true" id="segLabour">Labour</button>
        <button type="button" data-wt="Employee" aria-pressed="false" id="segEmp">Employee</button>
      </div>
      <div class="cam-ctrl">
        <button type="button" class="cc" id="flipE">Flip camera</button>
        <button type="button" class="cc" id="darkE" aria-pressed="true">Dark bg: On</button>
      </div>
      <div class="stage" id="stageE" data-face="no">
        <video id="camE" playsinline muted autoplay></video>
        <img class="frame hidden" id="frameE" alt="">
        <div class="spot"></div>
        <canvas id="trackE" class="track"></canvas>
        <div class="ring"></div>
        <div class="count hidden" id="countE"></div>
        <div class="badge">
          <div class="who" id="whoE">Position the face</div>
          <div class="sub" id="subE">Hold steady inside the ring.</div>
        </div>
      </div>
      <div class="note" id="noteE" data-tone="">A clear, close face captures on its own.</div>
      <div class="row">
        <button class="btn ghost" id="btnRetake" type="button">Retake</button>
        <button class="btn" id="btnCapture" type="button">Capture now</button>
      </div>
      <div class="row">
        <button class="btn ghost" id="btnBackToAttend" type="button">Back to attendance</button>
      </div>
    </section>
  </main>
</div>

<!-- modal host -->
<div class="back hidden" id="back">
  <div class="sheet">
    <h2 id="sheetTitle">Details</h2>
    <div class="body" id="sheetBody"></div>
    <div class="foot" id="sheetFoot"></div>
  </div>
</div>

<canvas id="cv" class="hidden"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" crossorigin="anonymous"></script>
<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var CSRF="{{ csrf_token }}";
  var PROJECT="{{ project }}";
  var PROJECT_NAME="{{ project_name }}";
  var MODELS="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model";

  // ---- tuning (client) ----
  var MIN_SCORE=0.55;      // detection confidence to ACT (TinyFaceDetector is ~0.5-0.9)
  var MIN_FACE=0.16;       // face box width / video width - phone at arm's length
  var STABLE_FRAMES=2;     // consecutive good frames before we act
  var PUNCH_COUNTDOWN=2;   // seconds before an auto punch
  // -------------------------

  var S={
    mode:"attend", ready:false, wt:"Labour",
    gps:null, lastId:null, opts:{},
    facingA:"user", facingE:"user", darkA:true, darkE:true,
    shift:null
  };

  function api(method,args,_retried){
    var fn = method.indexOf(".")>=0 ? method.split(".").pop() : method;
    return fetch("/api/method/sbi_projects.sbi_projects.face_api."+fn,{
      method:"POST", credentials:"same-origin",
      headers:{"Content-Type":"application/json","X-Frappe-CSRF-Token":CSRF},
      body:JSON.stringify(args||{})
    }).then(function(r){
      if(r.status===400 && !_retried){
        // likely a stale CSRF token - get a fresh one and retry once
        return fetch("/api/method/sbi_projects.sbi_projects.face_api.get_token",{credentials:"same-origin"})
          .then(function(x){return x.json();})
          .then(function(j){ if(j&&j.message&&j.message.csrf_token) CSRF=j.message.csrf_token;
            return api(method,args,true); });
      }
      if(!r.ok) return r.text().then(function(t){throw new Error("Server "+r.status);});
      return r.json().then(function(j){return j.message;});
    });
  }

  function note(el,tone,msg){el.setAttribute("data-tone",tone||"");el.textContent=msg;}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  // ---- sound + vibration ----
  var actx=null;
  function unlock(){ if(actx)return; try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} }
  document.addEventListener("touchstart",unlock,{once:true,passive:true});
  document.addEventListener("click",unlock,{once:true});
  function beep(kind){
    try{
      if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state==="suspended")actx.resume();
      var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
      var f=kind==="ok"?[660,990]:kind==="warn"?[440]:[200];
      f.forEach(function(x,i){o.frequency.setValueAtTime(x,t+i*0.1);});
      o.connect(g);g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.3,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+f.length*0.1+0.05);
      o.start(t);o.stop(t+f.length*0.1+0.08);
    }catch(e){}
    if(navigator.vibrate)navigator.vibrate(kind==="ok"?[60,40,60]:kind==="warn"?[120]:[200,80,200]);
  }

  // ---- camera ----
  var streams={};
  function stopAllCams(){
    Object.keys(streams).forEach(function(k){
      try{streams[k].getTracks().forEach(function(t){t.stop();});}catch(e){}
      delete streams[k];
    });
  }
  function startCam(video,key,facing){
    // release any camera first, then wait a beat so the device is free
    stopAllCams();
    return new Promise(function(resolve,reject){
      setTimeout(function(){
        navigator.mediaDevices.getUserMedia({
          video:{facingMode:facing||"user",width:{ideal:640},height:{ideal:480}},audio:false
        }).then(function(st){
          streams[key]=st;video.srcObject=st;
          video.play().catch(function(){});
          resolve();
        }).catch(function(err){
          // retry once after a longer wait (device may still be releasing)
          setTimeout(function(){
            navigator.mediaDevices.getUserMedia({
              video:{facingMode:facing||"user",width:{ideal:640},height:{ideal:480}},audio:false
            }).then(function(st){streams[key]=st;video.srcObject=st;video.play().catch(function(){});resolve();})
              .catch(reject);
          },500);
        });
      },200);
    });
  }
  function stopCam(key){var st=streams[key];if(st){st.getTracks().forEach(function(t){t.stop();});delete streams[key];}}

  function snapshot(video){
    var c=$("cv");c.width=video.videoWidth||480;c.height=video.videoHeight||640;
    var ctx=c.getContext("2d");
    ctx.drawImage(video,0,0,c.width,c.height);
    stampPhoto(ctx,c.width,c.height);
    return c.toDataURL("image/jpeg",0.85);
  }

  // burn the date/time + GPS onto the photo (attendance proof)
  function stampPhoto(ctx,w,h){
    var lines=[stamp()];
    if(S.gps){
      lines.push("GPS "+S.gps.lat.toFixed(5)+", "+S.gps.lng.toFixed(5));
    }else{
      lines.push("GPS: acquiring...");
    }
    if(PROJECT_NAME)lines.push(PROJECT_NAME);
    var fs=Math.max(14,Math.round(w*0.032));
    var pad=Math.round(fs*0.5);
    var lh=fs+pad;
    var barH=lh*lines.length+pad;
    ctx.fillStyle="rgba(0,0,0,.55)";
    ctx.fillRect(0,h-barH,w,barH);
    ctx.fillStyle="#fff";
    ctx.font="600 "+fs+"px system-ui,sans-serif";
    ctx.textBaseline="top";
    lines.forEach(function(t,i){
      ctx.fillText(t,pad,h-barH+pad+i*lh);
    });
  }

  // ---- face detection (one clean helper) ----
  var detOpts=null;
  function detect(video){
    if(!detOpts)detOpts=new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:0.5});
    return faceapi.detectSingleFace(video,detOpts).withFaceLandmarks().withFaceDescriptor();
  }
  // draw a Facebook-style tracking box on the overlay canvas
  function drawBox(canvasId, res, video, tone){
    var cv=$(canvasId); if(!cv||!video.videoWidth) return;
    // match canvas pixels to the video's displayed size
    var w=cv.clientWidth, h=cv.clientHeight;
    if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
    var ctx=cv.getContext("2d");
    ctx.clearRect(0,0,w,h);
    if(!res||!res.detection||!res.detection.box) return;
    var b=res.detection.box;
    // video uses object-fit:cover -> compute the scale + offset the browser applied
    var vw=video.videoWidth, vh=video.videoHeight;
    var scale=Math.max(w/vw, h/vh);
    var dispW=vw*scale, dispH=vh*scale;
    var offX=(w-dispW)/2, offY=(h-dispH)/2;
    // front camera is mirrored via CSS? our video is NOT mirrored, so no flip needed
    var x=b.x*scale+offX, y=b.y*scale+offY, bw=b.width*scale, bh=b.height*scale;
    var color=tone==="yes"?"#22c55e":tone==="near"?"#f59e0b":"#ffffff";
    // rounded corner brackets (camera-style)
    var r=Math.min(bw,bh)*0.22, lw=4;
    ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.lineCap="round";
    function corner(cx,cy,dx,dy){
      ctx.beginPath();
      ctx.moveTo(cx, cy+dy*r); ctx.lineTo(cx, cy); ctx.lineTo(cx+dx*r, cy);
      ctx.stroke();
    }
    corner(x, y, 1, 1);            // top-left
    corner(x+bw, y, -1, 1);       // top-right
    corner(x, y+bh, 1, -1);       // bottom-left
    corner(x+bw, y+bh, -1, -1);   // bottom-right
  }
  function clearBox(canvasId){var cv=$(canvasId);if(cv){var c=cv.getContext("2d");c.clearRect(0,0,cv.width,cv.height);}}

  function quality(res,video){
    if(!res)return {ok:false,detected:false,near:false,score:0};
    var score=(res.detection&&res.detection.score)||0;
    var box=res.detection&&res.detection.box;
    var frac=box&&video.videoWidth?box.width/video.videoWidth:0;
    // a face is DETECTED (ring shows) whenever face-api returns one
    if(score>=MIN_SCORE&&frac>=MIN_FACE)return {ok:true,detected:true,near:false,score:score,frac:frac};
    // detected but too small -> guide closer
    return {ok:false,detected:true,near:frac<MIN_FACE,score:score,frac:frac};
  }

  // =====================================================================
  // ATTENDANCE LOOP
  // =====================================================================
  var aGood=0, aBusy=false, aBusySince=0, aCountTimer=null, aCountVal=0, aPending=null;
  // watchdog: never let the attendance loop stay stuck
  setInterval(function(){
    if(aBusy && aBusySince && (Date.now()-aBusySince)>8000){ aBusy=false; aGood=0; }
  },2000);

  function attendLoop(){
    if(S.mode!=="attend"||!S.ready){return setTimeout(attendLoop,400);}
    if(aBusy){return setTimeout(attendLoop,300);}
    var v=$("camA"), stage=$("stageA");
    if(!v||!v.videoWidth){return setTimeout(attendLoop,250);}
    detect(v).then(function(res){
      var q=quality(res,v);
      drawBox("trackA",res,v,q.ok?"yes":q.detected?"near":"no");
      if(q.ok){
        aGood++;
        stage.setAttribute("data-face","yes");
        $("whoA").textContent="Hold still...";
        $("subA").textContent="Reading face ("+aGood+"/"+STABLE_FRAMES+")";
        if(aGood>=STABLE_FRAMES){
          aBusy=true;aBusySince=Date.now();
          var desc=Array.prototype.slice.call(res.descriptor);
          matchAndPunch(desc);
        }
      }else if(q.detected){
        aGood=0;stage.setAttribute("data-face","near");
        $("whoA").textContent="Come a little closer";
        $("subA").textContent="Fill the ring with your face.";
        cancelCount();
      }else{
        aGood=0;stage.setAttribute("data-face","no");
        $("whoA").textContent="Looking for a face...";
        $("subA").textContent="Look at the camera and hold still.";
        S.lastId=null;cancelCount();hideToday();
      }
    }).catch(function(){
      // keep the loop alive even if one detection throws
    }).then(function(){setTimeout(attendLoop,200);});
  }

  function matchAndPunch(desc){
    // safety: never let aBusy stay stuck
    var released=false;
    function release(){if(!released){released=true;setTimeout(function(){aBusy=false;aGood=0;},800);}}
    setTimeout(function(){if(!released){released=true;aBusy=false;aGood=0;}},6000); // hard fallback
    api("face_api.match",{embedding:desc,project:PROJECT}).then(function(m){
      if(!m){
        $("whoA").textContent="Not recognized";
        $("subA").textContent="Not enrolled here. Use Add worker.";
        note($("noteA"),"warn","Face not recognized at this site.");
        release();return;
      }
      $("whoA").textContent=m.name;
      $("subA").textContent=m.type+" - match "+Math.round(m.confidence*100)+"%";
      return api("face_api.day_status",{worker_type:m.type,worker_id:m.id,project:PROJECT})
        .then(function(ds){
          showToday(m.name,ds);
          if(ds.finished){
            note($("noteA"),"ok",m.name+" has completed all punches today.");
            beep("ok");release();return;
          }
          startCount(m,ds.next);
        });
    }).catch(function(e){note($("noteA"),"err",e.message);release();});
  }

  function startCount(m,next){
    cancelCount();aPending=m;aCountVal=PUNCH_COUNTDOWN;
    $("countA").classList.remove("hidden");$("countA").textContent=aCountVal;
    note($("noteA"),"",next+" - hold still...");
    aCountTimer=setInterval(function(){
      aCountVal--;
      if(aCountVal<=0){cancelCount();doPunch(m,next);}
      else{$("countA").textContent=aCountVal;}
    },1000);
  }
  function cancelCount(){
    if(aCountTimer){clearInterval(aCountTimer);aCountTimer=null;}
    $("countA").classList.add("hidden");aPending=null;
  }
  function doPunch(m,next){
    var photo=null;
    try{photo=snapshot($("camA"));}catch(e){}   // stamped with time + GPS
    api("face_api.punch",{worker_type:m.type,worker_id:m.id,project:PROJECT,
      log_type:next,latitude:S.gps&&S.gps.lat,longitude:S.gps&&S.gps.lng,photo:photo})
      .then(function(r){
        if(r.already){note($("noteA"),"warn",r.name+" already has "+r.log_type+" today.");beep("warn");}
        else{
          var extra=r.within_geofence?"":" (off-site "+Math.round(r.distance)+"m)";
          var lateMsg=lateFlag(r.log_type);
          note($("noteA"),r.within_geofence?"ok":"warn",
            r.name+" - "+r.log_type+"  "+stamp()+extra+lateMsg);
          beep(r.within_geofence?"ok":"warn");
        }
        return api("face_api.day_status",{worker_type:m.type,worker_id:m.id,project:PROJECT})
          .then(function(ds){showToday(r.name,ds);});
      }).catch(function(e){note($("noteA"),"err",e.message);})
      .then(function(){
        // brief pause so the same face doesn't immediately re-trigger
        setTimeout(function(){aBusy=false;aGood=0;},1800);
      });
  }

  function lateFlag(logType){
    if(logType!=="IN"||!S.shift||!S.shift.steps)return "";
    var inStep=S.shift.steps[0];
    if(!inStep||!inStep.time)return "";
    var now=new Date();
    var parts=inStep.time.split(":");
    var start=new Date(now); start.setHours(+parts[0], +parts[1], 0, 0);
    var graceMs=(S.shift.late_grace||0)*60000;
    if(now.getTime() > start.getTime()+graceMs){
      var mins=Math.round((now.getTime()-start.getTime())/60000);
      return "  LATE by "+mins+" min";
    }
    return "  (on time)";
  }

  function showToday(name,ds){
    $("todayA").classList.remove("hidden");
    var shiftName=S.shift&&S.shift.shift?(" - "+S.shift.shift):"";
    $("todayName").textContent=name+" - today"+shiftName;
    // steps from the shift (with expected times) if we have them
    var steps=(S.shift&&S.shift.steps&&S.shift.steps.length)?S.shift.steps
      :(ds.sequence||["IN","LUNCH OUT","LUNCH IN","OUT"]).map(function(k){return {key:k,label:k,time:null};});
    var done={};ds.punches.forEach(function(p){done[p.log_type]=p.time;});
    $("todayChips").innerHTML=steps.map(function(s){
      var actual=done[s.key];
      var label=s.label||s.key;
      var exp=s.time?" ("+s.time+")":"";
      var shown=actual?(" "+actual):exp;
      return '<span class="chip'+(actual?' done':'')+'">'+label+shown+'</span>';
    }).join("");
  }
  function hideToday(){$("todayA").classList.add("hidden");}

  // =====================================================================
  // ENROLLMENT LOOP  (accurate capture -> details -> aadhaar)
  // =====================================================================
  var eGood=0, eFrozen=false, eDesc=null, eImg=null;

  function enrollLoop(){
    if(S.mode!=="enroll"||!S.ready||eFrozen){return setTimeout(enrollLoop,400);}
    var v=$("camE");
    if(!v||!v.videoWidth){return setTimeout(enrollLoop,250);}
    detect(v).then(function(res){
      var q=quality(res,v);var stage=$("stageE");
      drawBox("trackE",res,v,q.ok?"yes":q.detected?"near":"no");
      if(q.ok){
        eGood++;
        stage.setAttribute("data-face","yes");
        $("whoE").textContent="Hold still...";
        $("subE").textContent=eGood+" / "+STABLE_FRAMES;
        if(eGood>=STABLE_FRAMES){freeze(res,v);return;}
      }else if(q.detected){
        eGood=0;stage.setAttribute("data-face","near");
        $("whoE").textContent="Come closer";$("subE").textContent="Fill the ring with your face.";
      }else{
        eGood=0;stage.setAttribute("data-face","no");
        $("whoE").textContent="Position the face";$("subE").textContent="Inside the ring, look ahead.";
      }
    }).catch(function(){}).then(function(){setTimeout(enrollLoop,200);});
  }

  function freeze(res,video){
    eFrozen=true;eGood=0;
    eDesc=Array.prototype.slice.call(res.descriptor);
    eImg=snapshot(video);
    $("frameE").src=eImg;$("frameE").classList.remove("hidden");$("camE").classList.add("hidden");
    $("stageE").setAttribute("data-face","yes");
    $("whoE").textContent="Checking...";$("subE").textContent="Please wait.";
    beep("ok");
    // check if this face is already enrolled (anywhere) BEFORE asking for details
    api("match_any",{embedding:eDesc}).then(function(m){
      if(m){
        // already in the system - tell them, do not open the form
        $("whoE").textContent="Already enrolled";
        $("subE").textContent=m.name+" ("+m.type+")";
        note($("noteE"),"warn","This face is already enrolled as "+m.name+" ("+m.type+"). No need to add again.");
        beep("warn");
        setTimeout(resetEnroll,2500);   // back to the camera after a moment
        return;
      }
      // new face -> collect details
      $("whoE").textContent="OK Captured";$("subE").textContent="Enter the details.";
      openDetails();
    }).catch(function(){
      // if the check fails, fall back to opening the form (server still guards duplicates)
      $("whoE").textContent="OK Captured";$("subE").textContent="Enter the details.";
      openDetails();
    });
  }

  function resetEnroll(){
    eFrozen=false;eGood=0;eDesc=null;eImg=null;
    $("frameE").classList.add("hidden");$("camE").classList.remove("hidden");
    $("whoE").textContent="Position the face";$("subE").textContent="Hold steady inside the ring.";
    $("stageE").setAttribute("data-face","no");
  }

  // ---- modal ----
  function modal(title,bodyHtml,buttons){
    $("sheetTitle").textContent=title;$("sheetBody").innerHTML=bodyHtml;
    var foot=$("sheetFoot");foot.innerHTML="";
    buttons.forEach(function(b){
      var el=document.createElement("button");
      el.type="button";el.textContent=b.label;
      el.className="btn"+(b.ghost?" ghost":"");el.onclick=b.onClick;foot.appendChild(el);
    });
    $("back").classList.remove("hidden");
  }
  function closeModal(){$("back").classList.add("hidden");$("sheetBody").innerHTML="";}
  function optList(a){return (a||[]).map(function(s){return '<option value="'+esc(s)+'">'+esc(s)+'</option>';}).join("");}

  function openDetails(){
    var isLab=S.wt==="Labour";
    var body='<label>Full name</label><input id="dName" placeholder="Full name">'+
      '<label>Gender</label><select id="dGender"><option value="">-</option>'+optList(S.opts.gender)+'</select>'+
      '<label>Phone</label><input id="dPhone" inputmode="tel" placeholder="Optional">';
    if(isLab){
      body+='<label>Skill</label><select id="dSkill"><option value="">-</option>'+optList(S.opts.skill)+'</select>'+
        '<label>Wage type</label><select id="dWage"><option value="">-</option>'+optList(S.opts.wage_types)+'</select>'+
        '<label>Wage rate</label><input id="dRate" inputmode="decimal" placeholder="0">';
    }
    modal("New "+S.wt,body,[
      {label:"Retake",ghost:true,onClick:function(){closeModal();resetEnroll();}},
      {label:"Add worker",onClick:function(){
        var name=($("dName").value||"").trim();
        if(!name){$("dName").focus();beep("warn");return;}
        var payload={worker_type:S.wt,name:name,embedding:eDesc,photo:eImg,project:PROJECT,
          gender:val("dGender"),phone:val("dPhone"),
          skill:val("dSkill"),wage_type:val("dWage"),wage_rate:val("dRate")};
        closeModal();
        note($("noteE"),"","Adding "+name+"...");
        api("face_api.enroll",payload).then(function(r){
          if(r&&r.duplicate){
            note($("noteE"),"warn","Already enrolled as "+r.name+" ("+r.type+").");
            beep("warn");resetEnroll();return;
          }
          beep("ok");
          note($("noteE"),"ok",r.name+" added. Capture Aadhaar next.");
          openAadhaar(r);
        }).catch(function(e){note($("noteE"),"err",e.message);beep("err");resetEnroll();});
      }}
    ]);
    setTimeout(function(){var n=$("dName");if(n)n.focus();},80);
  }
  function val(id){var e=$(id);return e?e.value:null;}

  function openAadhaar(worker){
    modal("Aadhaar - "+worker.name,
      '<div class="stage" style="aspect-ratio:16/10">'+
        '<video id="aaCam" playsinline muted autoplay></video>'+
        '<img class="frame hidden" id="aaImg" alt="">'+
      '</div>'+
      '<button class="btn" id="aaShot" style="margin-top:10px">Capture front</button>'+
      '<div class="tiny" id="aaMsg">Point at the front of the Aadhaar card.</div>'+
      '<label>Aadhaar number</label>'+
      '<input id="aaNum" inputmode="numeric" maxlength="14" placeholder="Reads from photo - check it">',
      [
        {label:"Skip",ghost:true,onClick:function(){closeModal();stopCam("aa");finishEnroll(worker,null,null,null);}},
        {label:"Save",onClick:function(){
          var num=($("aaNum").value||"").replace(/\D/g,"");
          if(num&&num.length!==12){$("aaMsg").textContent="Aadhaar must be 12 digits.";beep("warn");return;}
          closeModal();stopCam("aa");
          finishEnroll(worker,num||null,S._aaFront,S._aaBack);
        }}
      ]);
    S._aaFront=null;S._aaBack=null;S._aaStep="front";
    var cam=$("aaCam");
    startCam(cam,"aa","environment").catch(function(){$("aaMsg").textContent="Camera unavailable.";});
    $("aaShot").onclick=function(){
      var btn=this,v=$("aaCam"),img=$("aaImg");
      var data=snapshot(v);
      if(S._aaStep==="front"){
        S._aaFront=data;S._aaStep="back";
        img.src=data;img.classList.remove("hidden");v.classList.add("hidden");beep("ok");
        $("aaMsg").textContent="Reading number...";ocr(data);
        setTimeout(function(){img.classList.add("hidden");v.classList.remove("hidden");
          btn.textContent="Capture back";$("aaMsg").textContent="Now the back, then Capture.";},1400);
      }else{
        S._aaBack=data;beep("ok");img.src=data;img.classList.remove("hidden");v.classList.add("hidden");
        $("aaMsg").textContent="Both sides captured. Save when ready.";btn.disabled=true;
      }
    };
  }

  function ocr(dataUrl){
    if(typeof Tesseract==="undefined")return;
    Tesseract.recognize(dataUrl,"eng").then(function(res){
      var d=((res.data&&res.data.text)||"").replace(/\D/g,"");
      var m=d.match(/\d{12}/);var inp=$("aaNum");
      if(m&&inp){inp.value=m[0].replace(/(\d{4})(\d{4})(\d{4})/,"$1 $2 $3");
        $("aaMsg").textContent="Number read - check it.";}
      else $("aaMsg").textContent="Could not read - type it.";
    }).catch(function(){});
  }

  function finishEnroll(worker,num,front,back){
    var done=function(){
      beep("ok");
      resetEnroll();
      // show the worker in the list so it is clearly saved
      setMode("workers");
      note($("noteA"),"ok",worker.name+" added to this site.");
    };
    if(num||front||back){
      api("save_aadhaar",{worker_type:worker.type,worker_id:worker.id,
          aadhaar_number:num,front_image:front,back_image:back})
        .then(done).catch(function(){done();});
    }else{
      done();
    }
  }

  // =====================================================================
  // mode switch + boot
  // =====================================================================
  function loadRoster(){
    var box=$("rosterList");
    box.innerHTML='<div class="tiny">Loading...</div>';
    api("face_api.roster",{project:PROJECT}).then(function(rows){
      if(!rows||!rows.length){box.innerHTML='<div class="tiny">No workers enrolled at this site yet. Use Add worker.</div>';return;}
      box.innerHTML=rows.map(function(r){
        var av=r.photo?'<img class="av" src="'+esc(r.photo)+'">':'<span class="av"></span>';
        return '<div class="rw">'+av+
          '<span class="nm">'+esc(r.name)+'<small>'+esc(r.type)+(r.last?' - last '+esc(r.last):'')+'</small></span>'+
          '<span class="st '+(r.on_site?'on':'off')+'">'+(r.on_site?'On site':'Off')+'</span></div>';
      }).join("");
    }).catch(function(e){box.innerHTML='<div class="tiny">'+esc(e.message)+'</div>';});
  }

  function setMode(m){
    S.mode=m;
    $("attend").classList.toggle("hidden",m!=="attend");
    $("workers").classList.toggle("hidden",m!=="workers");
    $("enroll").classList.toggle("hidden",m!=="enroll");
    $("btnMode").textContent=m==="enroll"?"Attendance":"Add worker";
    stopCam("a");stopCam("e");cancelCount();clearBox("trackA");clearBox("trackE");
    if(m==="attend"){
      resetEnroll();
      if(!S.shift){api("get_shift",{project:PROJECT}).then(function(sh){S.shift=sh||{};});}
      startCam($("camA"),"a",S.facingA).then(function(){aBusy=false;aGood=0;attendLoop();});
    }else if(m==="enroll"){
      startCam($("camE"),"e",S.facingE).then(function(){resetEnroll();enrollLoop();});
    }else if(m==="workers"){
      loadRoster();
    }
  }

  function pad(n){return (n<10?"0":"")+n;}
  function stamp(d){
    d=d||new Date();
    return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+String(d.getFullYear()).slice(2)+
      " "+pad(d.getHours())+":"+pad(d.getMinutes());
  }
  function tickClock(){var c=$("clock");if(c)c.textContent=stamp();}

  function boot(){
    // site name text (avoid clobbering the clock child)
    $("siteName").childNodes[0].nodeValue=(PROJECT_NAME||"Site")+" ";
    tickClock();setInterval(tickClock,10000);
    $("btnMode").onclick=function(){setMode(S.mode==="enroll"?"attend":"enroll");};
    $("btnWorkers").onclick=function(){setMode("workers");};
    $("btnBackToAttend").onclick=function(){setMode("attend");};
    $("btnRetake").onclick=function(){resetEnroll();};
    document.querySelectorAll(".seg button").forEach(function(b){
      b.onclick=function(){S.wt=b.getAttribute("data-wt");
        document.querySelectorAll(".seg button").forEach(function(x){
          x.setAttribute("aria-pressed",x===b?"true":"false");});};
    });
    $("back").onclick=function(e){if(e.target===$("back")){closeModal();stopCam("aa");}};

    // camera flip (front/rear)
    $("flipA").onclick=function(){
      S.facingA=S.facingA==="user"?"environment":"user";
      startCam($("camA"),"a",S.facingA).then(function(){aBusy=false;aGood=0;});
    };
    $("flipE").onclick=function(){
      S.facingE=S.facingE==="user"?"environment":"user";
      resetEnroll();startCam($("camE"),"e",S.facingE);
    };
    // dark background toggle
    $("darkA").onclick=function(){
      S.darkA=!S.darkA;this.setAttribute("aria-pressed",S.darkA?"true":"false");
      this.textContent="Dark bg: "+(S.darkA?"On":"Off");
      $("stageA").querySelector(".spot").style.display=S.darkA?"":"none";
    };
    $("darkE").onclick=function(){
      S.darkE=!S.darkE;this.setAttribute("aria-pressed",S.darkE?"true":"false");
      this.textContent="Dark bg: "+(S.darkE?"On":"Off");
      $("stageE").querySelector(".spot").style.display=S.darkE?"":"none";
    };
    // manual capture (fallback if auto-freeze is slow)
    $("btnCapture").onclick=function(){
      if(eFrozen)return;
      var v=$("camE");
      detect(v).then(function(res){
        if(!res){note($("noteE"),"warn","No clear face. Move closer and try again.");beep("warn");return;}
        freeze(res,v);
      });
    };

    // GPS (non-blocking)
    if(navigator.geolocation){
      navigator.geolocation.watchPosition(function(p){
        S.gps={lat:p.coords.latitude,lng:p.coords.longitude};
      },function(){},{enableHighAccuracy:true,maximumAge:15000,timeout:12000});
    }

    // fetch a fresh CSRF token first (GET needs no CSRF); keeps POSTs valid
    fetch("/api/method/sbi_projects.sbi_projects.face_api.get_token",{credentials:"same-origin"})
      .then(function(r){return r.json();})
      .then(function(j){ if(j&&j.message&&j.message.csrf_token) CSRF=j.message.csrf_token; })
      .catch(function(){});

    // load models + options, then start
    note($("noteA"),"","Loading face models...");
    Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODELS),
      faceapi.nets.faceLandmark68Net.loadFromUri(MODELS),
      faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODELS),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODELS)
    ]).then(function(){
      // options are optional - a failure here must never block the camera
      return api("face_api.enroll_options",{}).then(function(o){S.opts=o||{};})
        .catch(function(){S.opts={gender:["Male","Female","Other"],skill:[],wage_types:[]};});
    }).then(function(){
      S.ready=true;
      note($("noteA"),"","Point the camera at a worker's face.");
      setMode("attend");
    }).catch(function(e){
      note($("noteA"),"err","Could not load the face models. Check the internet connection and reload.");
    });
  }

  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);
  else boot();
})();
</script>
</body>
</html>
