<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SBI Project Cost</title>
<style>
:root{--red:#BE1E2D}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{background:#f5f5f7;color:#222;padding-bottom:40px}
header{background:var(--red);color:#fff;padding:14px}
header h1{font-size:17px}
main{padding:12px;max-width:1000px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.07);overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 9px;border-bottom:1px solid #eee;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{background:#faf7f7;color:#a11;font-weight:600}
h3{font-size:14px;margin-bottom:8px}
.item a{color:var(--red);text-decoration:none;font-weight:600}
.item{padding:8px 0;border-bottom:1px solid #eee}
.cbtn{background:var(--red);color:#fff;border:0;border-radius:7px;padding:6px 10px;font-size:12px;cursor:pointer}
.hint{font-size:12px;color:#888;margin-top:6px}
.pos{color:#0a7d33}.neg{color:#c0392b}
</style>
</head>
<body>
<header style="display:flex;align-items:center;justify-content:space-between">
  <div style="display:flex;align-items:center"><img src="/assets/sbi_projects/site_app/sbi-logo-full.png" alt="SBI" style="height:34px;background:#fff;border-radius:8px;padding:3px 6px;margin-right:10px"><h1>SBI Project Cost - Budget vs Earned vs Actual</h1></div>
  <button type="button" id="hdrSignout" style="border:1px solid rgba(255,255,255,.7);background:none;color:#fff;border-radius:8px;padding:7px 11px;font-size:13px;font-weight:700">Sign out</button>
</header>
<script>document.addEventListener("DOMContentLoaded",function(){var b=document.getElementById("hdrSignout");if(b){b.onclick=function(){fetch("/api/method/logout",{method:"POST",credentials:"same-origin",headers:{"X-Frappe-CSRF-Token":"{{ csrf_token }}"}}).then(function(){location.replace("/login");}).catch(function(){location.href="/?cmd=web_logout";});};}});</script>
<main id="main"></main>
<script>
var DATA = {{ data_json | safe }};
var PROJECTS = {{ projects_json | safe }};
var PROJECT = "{{ project }}";
var CSRF = "{{ csrf_token }}";
function api(method,args){return fetch("/api/method/"+method,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json","X-Frappe-CSRF-Token":CSRF},body:JSON.stringify(args)}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.exception||("HTTP "+r.status));return j.message;});});}
function inr(v){v=Math.round(v||0);return "Rs " + v.toLocaleString("en-IN")}
var m = document.getElementById("main");
if(!PROJECT){
  m.innerHTML = "<div class='card'><h3>Select Project</h3>" + PROJECTS.map(function(p){
    return "<div class='item'><a href='/sbi_owner?project="+p[0]+"'>"+p[1]+"</a> <small>"+p[0]+"</small></div>";}).join("") + "</div>";
}else if(!DATA || !DATA.boq){
  m.innerHTML = "<div class='card'>No Project BOQ found for "+PROJECT+". Import BOQ first.</div>";
}else{
  var cats=["labour","material","equipment","subcontract","other"];
  var head="<tr><th>Category</th><th>Budget</th><th>Earned (billing)</th><th>Actual (internal)</th><th>Margin so far</th></tr>";
  var rows=cats.map(function(c){
    var b=DATA.budget[c],e=DATA.earned[c],a=DATA.actual[c],mg=e-a;
    return "<tr><td>"+c[0].toUpperCase()+c.slice(1)+"</td><td>"+inr(b)+"</td><td>"+inr(e)+"</td><td>"+inr(a)+"</td><td class='"+(mg>=0?"pos":"neg")+"'>"+inr(mg)+"</td></tr>";
  }).join("");
  var aTot=cats.reduce(function(s,c){return s+(DATA.actual[c]||0)},0);
  var tRow="<tr><th>Total</th><th>"+inr(DATA.budget.total)+"</th><th>"+inr(DATA.earned.total)+"</th><th>"+inr(aTot)+"</th><th class='"+((DATA.earned.total-aTot)>=0?"pos":"neg")+"'>"+inr(DATA.earned.total-aTot)+"</th></tr>";
  var stg="<tr><th>Stage</th><th>Budget</th><th>Earned</th><th>%</th><th></th></tr>"+DATA.stages.map(function(s){
    var p=s.budget?Math.round(100*s.total/s.budget):0;
    var btn=(DATA.current_stage===s.stage)?"<button class='cbtn' data-s='"+s.stage+"'>Complete stage</button>":"";
    return "<tr><td>"+s.stage+"</td><td>"+inr(s.budget)+"</td><td>"+inr(s.total)+"</td><td>"+p+"%</td><td>"+btn+"</td></tr>";}).join("");
  var cash=DATA.cash||{issued:0,spent:0,balance:0};
  var cashHtml="<table><tr><th>Petty Cash</th><th>Amount</th></tr>"+
    "<tr><td>Issued to site</td><td>"+inr(cash.issued)+"</td></tr>"+
    "<tr><td>Spent by site (Site Cash)</td><td>"+inr(cash.spent)+"</td></tr>"+
    "<tr><th>Balance at site</th><th>"+inr(cash.balance)+"</th></tr></table>"+
    "<div class='hint'>Issue cash via Site Cash Issue doctype. Site expenses marked Paid From = Site Cash reduce this balance.</div>";
  m.innerHTML =
    "<div class='card'><h3>"+PROJECT+" - Category Summary</h3><table>"+head+rows+tRow+"</table>"+
    "<div class='hint'>Labour actual source: "+(DATA.actual.labour_source||"-")+
    (DATA.sales_order?(" | Sales Order: "+DATA.sales_order):" | No Sales Order linked")+"</div></div>"+
    "<div class='card'><h3>Stage-wise</h3><table>"+stg+"</table>"+
    "<div class='hint'>Completing a stage opens the next stage on site. Then raise the stage invoice from the Sales Order (Create > Milestone Invoice).</div></div>"+
    "<div class='card'><h3>Petty Cash Reconciliation</h3>"+cashHtml+"</div>";
  document.querySelectorAll(".cbtn").forEach(function(b){
    b.onclick=function(){
      if(!confirm("Complete stage: "+b.dataset.s+" ?")) return;
      b.disabled=true;
      api("sbi_projects.project_cost_api.complete_stage",{project:PROJECT,stage:b.dataset.s})
      .then(function(r){alert(r.next_step);location.reload();})
      .catch(function(e){alert("Failed: "+e.message);b.disabled=false;});
    };
  });
}
</script>
</body>
</html>
