<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shiv Bharat Infrastructures - Project Status</title>
<style>
:root{--red:#BE1E2D;--org:#E53F0C}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{background:#f5f5f7;color:#222;padding-bottom:40px}
header{background:var(--red);color:#fff;padding:16px 14px}
header h1{font-size:17px}
header .sub{font-size:13px;opacity:.9;margin-top:2px}
main{padding:12px;max-width:760px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
h3{font-size:14px;margin-bottom:10px;color:#333}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat{border:1px solid #eee;border-radius:10px;padding:10px}
.cat .n{font-size:12px;color:#888}
.cat .v{font-size:16px;font-weight:700;color:var(--red)}
.bar{height:8px;background:#eee;border-radius:5px;overflow:hidden;margin-top:6px}
.bar>div{height:100%;background:var(--org)}
.st{padding:9px 0;border-bottom:1px solid #f0f0f0}
.st .t{display:flex;justify-content:space-between;font-size:13px}
.st small{color:#888}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 8px;border-bottom:1px solid #eee;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{background:#faf7f7;color:#a11}
.done{color:#0a7d33;font-weight:600}
.hint{font-size:11.5px;color:#999;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>Shiv Bharat Infrastructures</h1>
  <div class="sub" id="pname">Project Status</div>
</header>
<main id="main"></main>
<script>
var VALID = {{ valid }};
var DATA = {{ data_json | safe }};
function inr(v){v=Math.round(v||0);return "Rs " + v.toLocaleString("en-IN")}
var m=document.getElementById("main");
if(!VALID){
  m.innerHTML="<div class='card'>This link is invalid or disabled. Please contact Shiv Bharat Infrastructures.</div>";
}else{
  document.getElementById("pname").textContent=DATA.project_name;
  var cats=[["labour","Labour"],["material","Material"],["equipment","Equipment"],["subcontract","Subcontract"],["other","Other"]];
  var catHtml=cats.map(function(c){
    return "<div class='cat'><div class='n'>"+c[1]+"</div><div class='v'>"+inr(DATA.categories[c[0]])+"</div></div>";
  }).join("")+"<div class='cat'><div class='n'>Total Work Done Value</div><div class='v'>"+inr(DATA.total)+"</div></div>";
  var stHtml=DATA.stages.map(function(s){
    return "<div class='st'><div class='t'><span>"+s.stage+"</span><span>"+s.pct+"%</span></div>"+
      "<div class='bar'><div style='width:"+Math.min(100,s.pct)+"%'></div></div>"+
      "<small>"+(s.status==="Completed"?"Completed":"In progress")+" - value "+inr(s.value)+"</small></div>";
  }).join("");
  var lnHtml="<table><tr><th>Work Item</th><th>Done</th><th>Value</th></tr>"+DATA.lines.map(function(l){
    return "<tr><td>"+l.stage+"<br><b>"+l.activity+"</b></td><td>"+l.done_qty+" / "+l.boq_qty+" "+(l.unit||"")+"</td><td>"+inr(l.value)+"</td></tr>";
  }).join("")+"</table>";
  var vrHtml=DATA.verifications.length?DATA.verifications.map(function(v){
    return "<div class='st'><div class='t'><span>"+v.verify_date+" - "+v.customer_name+"</span><span class='done'>Signed</span></div><small>"+(v.stage||"")+"</small></div>";
  }).join(""):"<small>No signed verifications yet</small>";
  m.innerHTML=
    "<div class='card'><h3>Cost Flow (5 Categories)</h3><div class='cats'>"+catHtml+"</div>"+
    "<div class='hint'>Values shown are agreed contract (BOQ) values of completed work.</div></div>"+
    "<div class='card'><h3>Stage Progress</h3>"+stHtml+"</div>"+
    "<div class='card'><h3>Work Done Detail (reasons)</h3>"+lnHtml+"</div>"+
    "<div class='card'><h3>Your Signed Verifications</h3>"+vrHtml+"</div>";
}
</script>
</body>
</html>
